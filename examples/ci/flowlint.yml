# Consumer template — copy this into YOUR app's repository as
# .github/workflows/flowlint.yml
#
# It assumes flowlint lives at ./flowlint (vendored) and your flow definitions at
# ./docs/ux-flows/*.flow.json. Adjust both paths to match your layout.

name: flowlint

on:
  pull_request:
    paths:
      - 'docs/ux-flows/**'
      - 'src/**'
      - 'app/**'
      - 'lib/**'
  push:
    branches: [main]

jobs:
  flowlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 1. The IR must be well formed.
      - name: Validate flow definitions
        run: python3 flowlint/scripts/flowlint.py validate docs/ux-flows/*.flow.json

      # 2. The committed diagrams must match the IR. Fails if someone edited a
      #    flow.json without regenerating — this is what stops diagrams rotting.
      - name: Check diagrams are up to date
        run: python3 flowlint/scripts/flowlint.py stale docs/ux-flows/*.flow.json -o docs/ux-flows

      # 3. Block merges that introduce a dead end or an unhandled network failure.
      #    Findings the team has accepted live in .flowlintignore and do not fail the build,
      #    which is what makes this switch adoptable on an existing codebase.
      - name: Lint the flows
        run: python3 flowlint/scripts/flowlint.py check docs/ux-flows/*.flow.json --fail-on-high

      # 4. Surface the headline and priority list in the PR, so reviewers see the
      #    findings without opening a file.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## flowlint"
            for f in docs/ux-flows/*.md; do
              [ -e "$f" ] || continue
              echo ""
              # everything up to the embedded diagram: summary + priority list
              sed -n '1,/^## Akış$/p' "$f" | sed '$d'
            done
          } >> "$GITHUB_STEP_SUMMARY"
