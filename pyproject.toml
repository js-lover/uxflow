[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlint"
version = "1.3.1"
description = "Lint your app's real user flows. Reads the codebase, maps every screen and branch, and reports the dead ends, unhandled errors and friction the code actually contains."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "flowlint contributors" }]
keywords = [
    "ux", "ux-research", "flowchart", "drawio", "diagrams-net", "mermaid",
    "documentation-as-code", "static-analysis", "developer-tools", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

# Deliberately empty, and it should stay that way. Standard library only is a
# feature: the tool has to run inside whatever environment an agent finds itself
# in, without a resolver step.
dependencies = []

[project.urls]
Homepage = "https://github.com/js-lover/flowlint"
Repository = "https://github.com/js-lover/flowlint"
Issues = "https://github.com/js-lover/flowlint/issues"
Changelog = "https://github.com/js-lover/flowlint/releases"

[project.scripts]
flowlint = "flowlint.cli:main"

# The package ships from scripts/flowlint_lib/ under the import name `flowlint`.
# The directory keeps its name so that a vendored checkout can still be run as
# `python3 flowlint/scripts/flowlint.py` with no install; the modules use relative
# imports, so the same code serves both.
[tool.setuptools]
package-dir = { "flowlint" = "scripts/flowlint_lib" }
packages = ["flowlint"]

[tool.setuptools.package-data]
flowlint = ["py.typed"]

[tool.setuptools.data-files]
"share/flowlint/schema" = ["schema/flow.schema.json"]
