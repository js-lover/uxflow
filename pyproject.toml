[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uxflow"
version = "1.1.1"
description = "Turn an existing app's code into editable UX flow diagrams and an actionable UX audit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "uxflow contributors" }]
keywords = [
    "ux", "ux-research", "flowchart", "drawio", "diagrams-net", "mermaid",
    "documentation-as-code", "static-analysis", "developer-tools", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

# Deliberately empty, and it should stay that way. Standard library only is a
# feature: the tool has to run inside whatever environment an agent finds itself
# in, without a resolver step.
dependencies = []

[project.urls]
Homepage = "https://github.com/js-lover/uxflow"
Repository = "https://github.com/js-lover/uxflow"
Issues = "https://github.com/js-lover/uxflow/issues"
Changelog = "https://github.com/js-lover/uxflow/releases"

[project.scripts]
uxflow = "uxflow.cli:main"

# The package ships from scripts/uxflow_lib/ under the import name `uxflow`.
# The directory keeps its name so that a vendored checkout can still be run as
# `python3 uxflow/scripts/uxflow.py` with no install; the modules use relative
# imports, so the same code serves both.
[tool.setuptools]
package-dir = { "uxflow" = "scripts/uxflow_lib" }
packages = ["uxflow"]

[tool.setuptools.package-data]
uxflow = ["py.typed"]

[tool.setuptools.data-files]
"share/uxflow/schema" = ["schema/flow.schema.json"]
