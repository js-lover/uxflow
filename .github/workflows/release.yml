# Ships a release: the installable .skill bundle and the PyPI package.
# Trigger:  git tag v1.1.1 && git push origin v1.1.1

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: build .skill and attach to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tests must pass before we ship
        run: python3 -m unittest discover -s tests

      - name: Version in pyproject.toml must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag $TAG != pyproject version $FILE"; exit 1
          fi

      - name: Build uxflow.skill
        run: |
          rm -rf build && mkdir -p build/uxflow
          cp -r SKILL.md AGENTS.md README.md LICENSE CONTRIBUTING.md \
                schema scripts references examples tests build/uxflow/
          rm -rf build/uxflow/examples/output build/uxflow/examples/preview
          find build -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          cd build && zip -qr ../uxflow.skill uxflow
          cd .. && unzip -l uxflow.skill

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: uxflow.skill
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: bundle
    environment:
      name: pypi
      url: https://pypi.org/p/uxflow
    permissions:
      id-token: write          # trusted publishing; no API token to leak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      # Install the built wheel in a clean venv and exercise the console script.
      # A package that imports but cannot run is not a working release.
      - name: Smoke-test the wheel
        run: |
          python3 -m venv /tmp/v && . /tmp/v/bin/activate
          pip install --quiet dist/*.whl
          cd /tmp
          uxflow init smoke -o flows
          uxflow validate flows/smoke.flow.json
          uxflow render flows/smoke.flow.json -o rendered
          test -f rendered/smoke.drawio && test -f rendered/smoke.md

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
