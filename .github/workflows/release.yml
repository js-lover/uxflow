# Ships a release: the installable .skill bundle and the PyPI package.
# Trigger:  git tag v1.1.1 && git push origin v1.1.1

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: build .skill and attach to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tests must pass before we ship
        run: python3 -m unittest discover -s tests

      - name: Version in pyproject.toml must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag $TAG != pyproject version $FILE"; exit 1
          fi

      - name: Build flowlint.skill
        run: |
          rm -rf build && mkdir -p build/flowlint
          cp -r SKILL.md AGENTS.md README.md LICENSE CONTRIBUTING.md pyproject.toml \
                schema scripts references examples tests build/flowlint/
          rm -rf build/flowlint/examples/output build/flowlint/examples/preview
          find build -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          find build -name '*.pyc' -delete 2>/dev/null || true
          cd build && zip -qr ../flowlint.skill flowlint
          cd .. && unzip -l flowlint.skill

      # Unpack the bundle somewhere clean and actually run it. A .skill that
      # unzips but cannot execute is the failure mode nobody notices until a
      # user reports it.
      - name: Smoke-test the bundle
        run: |
          rm -rf /tmp/sk && mkdir /tmp/sk && cd /tmp/sk
          unzip -q "$GITHUB_WORKSPACE/flowlint.skill"
          python3 flowlint/scripts/flowlint.py --help > /dev/null
          python3 flowlint/scripts/flowlint.py validate flowlint/examples/*.flow.json
          python3 flowlint/scripts/flowlint.py render flowlint/examples/auth-login.flow.json -o out
          test -f out/auth-login.drawio && test -f out/auth-login.md
          cd flowlint && python3 -m unittest discover -s tests

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: flowlint.skill
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: bundle
    environment:
      name: pypi
      url: https://pypi.org/p/flowlint
    permissions:
      id-token: write          # trusted publishing; no API token to leak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      # Install the built wheel in a clean venv and exercise the console script.
      # A package that imports but cannot run is not a working release.
      - name: Smoke-test the wheel
        run: |
          python3 -m venv /tmp/v && . /tmp/v/bin/activate
          pip install --quiet dist/*.whl
          cd /tmp
          flowlint init smoke -o flows
          flowlint validate flows/smoke.flow.json
          flowlint render flows/smoke.flow.json -o rendered
          test -f rendered/smoke.drawio && test -f rendered/smoke.md

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
